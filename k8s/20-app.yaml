# The storefront. The Service below is the load balancer: kube-proxy spreads connections over
# the pods that pass the readiness probe, so booting or draining pods get no traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: bbd
spec:
  replicas: 3
  selector:
    matchLabels: {app: app}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 50%, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: app}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: bbd-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: CONCURRENCY, value: "2"}
            - {name: SERVICE_MS, value: "250"}
            - {name: START_DELAY_S, value: "3"}     # simulated boot time; readiness waits for it
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 1
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: ["sleep", "3"]}       # let endpoint removal propagate before SIGTERM
          resources:
            requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: bbd
spec:
  type: NodePort
  selector: {app: app}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
