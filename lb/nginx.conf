events { worker_connections 4096; }

http {
    # Docker's embedded DNS returns every replica of the `app` service; nginx re-resolves
    # every 2s so scale-out/in is picked up without a reload (software LB, no appliance).
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 8080;

        location /nginx_status { stub_status; }

        location / {
            set $upstream http://app:8000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            # A replica that is still booting / draining is skipped transparently.
            proxy_next_upstream error timeout http_502;
            proxy_next_upstream_tries 3;
        }
    }
}
